# Kin shares its host with other deployments (including a separate Hermes stack). Everything here
# stays inside the `kin` project: own network, no container_name, loopback-only ports, capped
# resources and rotated logs. Credentials (bot token, keys) are Kin's own, from .env.
name: kin

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  kin:
    build: .
    image: kin:dev
    env_file: .env
    environment:
      KIN_DATA_DIR: /app/data
      KIN_MCP_HOST: 0.0.0.0
      KIN_MCP_PORT: "8765"
    volumes:
      - ./data:/app/data
    ports:
      # Hermes reaches kin over the compose network (http://kin:8765); the host port is for local
      # debugging only, so it is bound to loopback.
      - "127.0.0.1:${KIN_MCP_PORT:-8765}:8765"
    # Until `kin serve` exists (ROADMAP D2/D3) the service runs the self-check and exits.
    # At D3: command: ["serve"] and restart: unless-stopped.
    command: ["check", "--no-spend"]
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *logging

  hermes:
    build: ./docker/hermes
    image: kin-hermes:dev
    env_file: .env
    environment:
      HERMES_HOME: /opt/data
    volumes:
      - ./hermes/home:/opt/data          # persistent: install, config.yaml, .env, state.db, memory, skills
      - ./hermes/config.yaml:/seed/config.yaml:ro
    depends_on:
      - kin
    init: true                           # reap the gateway's child processes (Hermes warns as PID 1)
    restart: unless-stopped
    # No published ports: Telegram is outbound polling.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    logging: *logging
    # First start seeds config.yaml, installs Hermes (a few minutes), then runs the gateway.
    # One-off commands: docker compose run --rm --no-deps hermes doctor
    #                   docker compose run --rm --no-deps hermes shell
