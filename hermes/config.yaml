# Hermes Agent config template for Kin. Copied to $HERMES_HOME/config.yaml on the container's
# first start, before the installer runs; `make hermes-config` re-applies every key below (and
# hermes/SOUL.md) to an existing install. Secrets come from the environment (.env via compose):
# NEBIUS_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, TELEGRAM_GROUP_ALLOWED_CHATS,
# TELEGRAM_HOME_CHANNEL. Reference: https://hermes-agent.nousresearch.com/docs/
#
# Kin's records, intake and boundaries live in the kin service, reached through the Kin plugin
# (hermes/plugins/kin) rather than MCP: Hermes passes no caller identity to MCP
# servers, and every Kin decision depends on who is asking (docs/05-architecture.md).

# Kin's bridge plugin (hermes/plugins/kin, mounted read-only by compose).
plugins:
  enabled: [kin]

model:
  provider: "nebius"                              # alias of nebius-token-factory
  default: "nvidia/nemotron-3-super-120b-a12b"    # conversation and answers; vision/Nano are called by the kin service

# Super is text-only. Inbound photos go to the Token Factory vision model, whose description is
# passed to Super (Hermes' text path). Same model as KIN_MODEL_VISION; see docs/05-architecture.md.
auxiliary:
  vision:
    provider: "nebius"
    model: "openbmb/MiniCPM-V-4_5"
  background_review:
    enabled: false

agent:
  image_input_mode: text
  # The gateway is reachable by every member of the allow-listed group and runs on a shared host:
  # no shell, code execution, browser, file access or delegation (they could reach other services
  # on the host or read secrets on the volume), and no Hermes web search (Tavily lookups go through
  # Kin's locale allow-list). Hermes' own memory, session search, skills and cron are off too: they
  # are shared across every user and chat, so they would bypass Kin's per-person boundaries; Kin's
  # store is the family's memory and Kin runs the skills. clarify, todo and vision are off too:
  # photos go to Kin's intake and Kin asks its one clarifying question in plain text. Left: Kin's
  # own tools (kin_ask, kin_note, kin_lookup).
  disabled_toolsets:
    - terminal
    - code_execution
    - browser
    - computer_use
    - file
    - web
    - search
    - delegation
    - image_gen
    - video_gen
    - tts
    - x_search
    - connections
    - kanban
    - memory
    - session_search
    - skills
    - cronjob
    - clarify
    - todo
    - vision

# Kin's two tools are always in view; deferring them behind tool search made Super skip them.
tools:
  tool_search:
    enabled: "off"

memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0

skills:
  creation_nudge_interval: 0

# Voice notes are not transcribed: consent comes first (docs/04-safety.md) and no audio-capable
# model is listed on Token Factory for our key.
stt:
  enabled: false

# Kin checks each final reply before it is sent (the plugin's transform_llm_output hook). Text
# streamed or sent between tool calls would skip that check, so both stay off for Telegram.
streaming:
  enabled: false
display:
  platforms:
    telegram:
      streaming: false
      interim_assistant_messages: false

# Kin answers every slash command and sets the family chats' menus itself (kin/admin.py). Hermes'
# own menu, shown wherever Kin hasn't set one (a judge before /demo), is cut to /help, which Kin
# answers.
platforms:
  telegram:
    extra:
      command_menu:
        max_commands: 1
        priority: [help]

telegram:
  require_mention: false        # the Kin plugin gates group text itself (docs/05-architecture.md)
  reply_to_mode: first

terminal:
  backend: local                # terminal toolset is disabled above; backend kept at the default
