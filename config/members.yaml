# Demo roster (docs/02-product.md, Roles; docs/06-synthetic-data.md, Family). All people are
# fictional; `call` is how Kin names them in chat. Telegram user IDs are not stored here: the
# admin is KIN_ADMIN_TELEGRAM_ID and other members are mapped in KIN_MEMBER_IDS
# (`id:telegram_id,...`) in .env. A member without a mapped account is roster-only: they never
# message Kin, but their language still shapes group posts.

members:
  - id: mei_ling
    name: Lim Mei Ling
    call: Mei Ling
    role: admin
    language: en
  - id: wei_jie
    name: Lim Wei Jie
    call: Wei Jie
    role: family
    language: en
  - id: bee_lian
    name: Tan Bee Lian
    call: Bee Lian
    role: family
    language: zh
  - id: siti
    name: Siti Rahmah
    call: Siti
    role: carer
    language: en

# The household. Kin proposes reminder times from a document's own words ("in the morning"
# → morning) and the Admin confirms every schedule before anything is active. Local times.
household:
  care_recipient:           # who the records are about, and how Kin names them in chat
    name: Mdm Tan Siew Lan
    call: Ah Ma
  medicines_by: siti        # receives medicine reminders
  appointments_by: mei_ling # attends appointments; reminded the evening before
  times:
    before_breakfast: "07:30"
    morning: "08:00"
    breakfast: "08:00"
    lunch: "13:00"
    dinner: "19:00"
    night: "21:30"
    three_times_after_food: ["08:30", "13:30", "19:30"]
  appointment_reminder: "19:00"
  refill_days_ahead: 3

# Unknown senders get no role and see nothing (fail closed). The disposable judge fixture assigns
# roles with `/demo` instead (docs/07-demo-plan.md). Language for anyone not listed:
default_language: en
