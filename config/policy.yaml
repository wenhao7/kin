# Default role × category policy (docs/03-privacy-boundaries.md).
# Levels: read | write | summary | none. `write` implies read. Qualifiers (`level:qualifier`):
# `own` = records the principal created; `emergency_contacts` = the emergency-contact records in
# `admin`. Editable per family by the admin; this file is the demo default.

roles: [admin, family, carer, viewer]

categories:
  [medical, medication, appointments, tasks, observations, finance, legal, admin, notes]

# Categories that trigger a share request instead of a plain refusal when a role has `none`.
share_request_on_none: [finance, legal]

matrix:
  medical:
    admin: write
    family: summary
    carer: summary
    viewer: none
  medication:
    admin: write
    family: read
    carer: read
    viewer: read
  appointments:
    admin: write
    family: read
    carer: read
    viewer: none
  tasks:
    admin: write
    family: read
    carer: write:own
    viewer: write:own
  observations:
    admin: read
    family: read
    carer: write:own
    viewer: write:own
  finance:
    admin: write
    family: none
    carer: none
    viewer: none
  legal:
    admin: write
    family: none
    carer: none
    viewer: none
  admin:
    admin: write
    family: read
    carer: read:emergency_contacts
    viewer: read:emergency_contacts
  notes:
    admin: write
    family: write:own
    carer: write:own
    viewer: none

# Where restricted answers are delivered. `dm` = only to the asker in a private chat. What the
# group itself may see is computed from its members (docs/03-privacy-boundaries.md, Behaviour).
delivery:
  restricted_answers: dm
